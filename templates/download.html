{% extends "base.html" %}

{% block title %}Download - HealthChain{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="mb-4 text-center text-md-start">
                <h2 class="mb-1">Download Record</h2>
                <p class="text-muted mb-0">Provide the original key to decrypt and retrieve this file.</p>
            </div>
            <div class="card">
                <div class="card-header bg-white">
                    <h4 class="mb-0">
                        <i class="bi bi-download me-2 text-primary"></i>
                        Download Record
                    </h4>
                </div>
                <div class="card-body p-4">
                    <div class="alert alert-info mb-4">
                        <strong>IPFS Hash:</strong><br>
                        <code>{{ record.ipfs_hash }}</code>
                    </div>

                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-4">
                            <label class="form-label">Decryption Key</label>
                            <input type="password" name="encryption_key" class="form-control" placeholder="Enter the encryption key" required>
                            <small class="text-muted">Enter the same key used during upload</small>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-download me-2"></i>Decrypt & Download
                        </button>
                    </form>
                </div>
            </div>

            <a href="{{ url_for('records') }}" class="btn btn-outline-secondary mt-3">
                <i class="bi bi-arrow-left me-2"></i>Back to Records
            </a>
        </div>
    </div>
</div>
{% endblock %}
